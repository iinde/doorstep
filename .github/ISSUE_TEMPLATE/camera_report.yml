name: Camera report
description: Tell us how Doorstep works with your Ring camera
labels: [camera]
body:
  - type: input
    id: model
    attributes:
      label: Camera model
      placeholder: "Ring Video Doorbell 4 (battery)"
    validations:
      required: true
  - type: dropdown
    id: power
    attributes:
      label: Power
      options: [Battery, Wired, Solar, Plug-in]
  - type: checkboxes
    id: works
    attributes:
      label: What works?
      options:
        - label: Live view
        - label: Sound from the camera
        - label: Hold to talk
        - label: Light / siren
        - label: Shows in History
        - label: Recording on my Mac
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
